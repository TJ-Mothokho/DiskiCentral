trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"

  - script: npm --prefix diskicentral ci
    displayName: Install dependencies

  - script: npm --prefix diskicentral test
    displayName: Run live infrastructure tests

  - script: npm --prefix diskicentral run lint
    displayName: Run ESLint

  - script: npm --prefix diskicentral exec tsc -- --noEmit
    displayName: Run TypeScript validation

  - script: npm --prefix diskicentral run build
    displayName: Build Next.js application
    env:
      X_APISPORTS_KEY: $(API_FOOTBALL_KEY)

  - task: Docker@2
    displayName: Build live WebSocket image
    inputs:
      command: build
      Dockerfile: diskicentral/Dockerfile.live
      buildContext: diskicentral
      tags: |
        $(Build.BuildId)
        latest
